name: Read-only D1 and Live Site Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-schema-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Confirm secrets exist without printing values
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          echo "Required Cloudflare secrets are present."

      - name: Read-only D1 data completeness audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/wrangler.jsonc" <<'JSON'
          {
            "name": "d1-read-only-audit",
            "compatibility_date": "2026-10-25",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "jee-pyq-master",
              "database_id": "2e1d7706-156f-409a-8e5d-8c4284e3d9c3"
            }]
          }
          JSON
          echo "----- Question completeness metrics -----"
          SQL="SELECT json_object(
            'questions_total',(SELECT COUNT(*) FROM questions),
            'demo_questions',(SELECT COUNT(*) FROM questions WHERE is_demo=1),
            'non_demo_questions',(SELECT COUNT(*) FROM questions WHERE is_demo=0),
            'blank_question_text',(SELECT COUNT(*) FROM questions WHERE TRIM(COALESCE(question_text,''))=''),
            'blank_correct_answer',(SELECT COUNT(*) FROM questions WHERE TRIM(COALESCE(correct_answer,''))=''),
            'missing_solution_inline_or_table',(SELECT COUNT(*) FROM questions q WHERE TRIM(COALESCE(q.solution,''))='' AND NOT EXISTS (SELECT 1 FROM solutions s WHERE s.question_id=q.id AND TRIM(COALESCE(s.solution_text,''))<>'')),
            'questions_without_image_record',(SELECT COUNT(*) FROM questions q WHERE NOT EXISTS (SELECT 1 FROM question_images i WHERE i.question_id=q.id)),
            'questions_with_fewer_than_4_options',(SELECT COUNT(*) FROM questions q WHERE (SELECT COUNT(*) FROM question_options o WHERE o.question_id=q.id)<4),
            'questions_without_options',(SELECT COUNT(*) FROM questions q WHERE NOT EXISTS (SELECT 1 FROM question_options o WHERE o.question_id=q.id)),
            'questions_without_session',(SELECT COUNT(*) FROM questions WHERE session_id IS NULL),
            'option_rows',(SELECT COUNT(*) FROM question_options),
            'solution_rows',(SELECT COUNT(*) FROM solutions),
            'image_rows',(SELECT COUNT(*) FROM question_images),
            'year_rows',(SELECT COUNT(*) FROM years),
            'subject_rows',(SELECT COUNT(*) FROM subjects),
            'session_rows',(SELECT COUNT(*) FROM sessions),
            'import_runs',(SELECT COUNT(*) FROM import_runs),
            'import_errors',(SELECT COUNT(*) FROM import_errors)
          ) AS audit;"
          npx --yes wrangler@4 d1 execute jee-pyq-master --remote --config "$RUNNER_TEMP/wrangler.jsonc" --json --command "$SQL"

          echo "----- Question counts by subject and year -----"
          npx --yes wrangler@4 d1 execute jee-pyq-master --remote --config "$RUNNER_TEMP/wrangler.jsonc" --json --command "SELECT s.name AS subject, y.year, COUNT(*) AS questions FROM questions q JOIN subjects s ON s.id=q.subject_id JOIN years y ON y.id=q.year_id GROUP BY s.name,y.year ORDER BY y.year DESC,s.name;"

      - name: Probe existing production endpoints
        shell: bash
        run: |
          probe() {
            local label="$1"
            local url="$2"
            local file="$RUNNER_TEMP/response.txt"
            echo "----- $label -----"
            local code
            code="$(curl -L -sS --max-time 25 -o "$file" -w '%{http_code}' "$url" || true)"
            echo "HTTP status: ${code:-no-response}"
            if [ -f "$file" ]; then head -c 600 "$file" | tr '\n' ' '; echo; fi
          }
          probe "Frontend Worker" "https://jee-pyq-master-frontend.k63920710.workers.dev/"
          probe "API health" "https://jee-pyq-master-api.k63920710.workers.dev/health"
          probe "API root" "https://jee-pyq-master-api.k63920710.workers.dev/"
