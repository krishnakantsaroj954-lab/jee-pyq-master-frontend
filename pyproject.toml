[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jee-pyq-source-image-pipeline"
version = "1.0.0"
description = "Fail-closed JEE source PDF image-first pipeline"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "Pillow>=10,<13"]

[project.scripts]
jee-pyq-pipeline = "jee_pyq_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "pipeline"}

[tool.setuptools.packages.find]
where = ["pipeline"]
