name: JEE Main Jan 22 source-gated OCR dry run

on:
  push:
    branches:
      - fix/jan22-scan-ocr-dry-run-20261022
    paths:
      - "cEDaK5Wn5ILe4nOdotd6.pdf"
      - "representative-config.json"
      - "run-dry-run.sh"
      - "scripts/verify_jan22_source.py"
      - ".github/workflows/jan22-source-dry-run.yml"
      - "pipeline/jee_pyq_pipeline/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "cEDaK5Wn5ILe4nOdotd6.pdf"
      - "representative-config.json"
      - "run-dry-run.sh"
      - "scripts/verify_jan22_source.py"
      - ".github/workflows/jan22-source-dry-run.yml"
      - "pipeline/jee_pyq_pipeline/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gated-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source and pipeline revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR engine and package
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run parser and validation tests
        run: python -m pytest -q

      - name: Verify exact Jan 22 source PDF identity
        id: source
        continue-on-error: true
        run: python scripts/verify_jan22_source.py

      - name: Run real-PDF OCR extraction (no D1 import)
        if: steps.source.outcome == 'success' && steps.source.outputs.verified == 'true'
        shell: bash
        run: |
          set -o pipefail
          ./run-dry-run.sh 2>&1 | tee /tmp/jan22-dry-run.log

      - name: Summarize the source gate and extraction result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          pdf = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          config = json.loads(Path("representative-config.json").read_text(encoding="utf-8"))
          if not pdf.is_file():
              summary.write_text("## Jan 22 source-gated dry run\n\n**BLOCKED:** source PDF is missing.\n", encoding="utf-8")
              raise SystemExit(0)

          import hashlib
          actual = hashlib.sha256(pdf.read_bytes()).hexdigest()
          expected = config.get("expected_source_sha256", "")
          lines = [
              "## JEE Main · 22 January 2026 · Shift 1",
              "",
              f"- Source SHA-256: `{actual}`",
              f"- Pinned SHA-256: `{expected}`",
              f"- Source match: **{'PASS' if actual == expected else 'BLOCKED — MISMATCH'}**",
              "- Production import / D1 writes: **NOT PERFORMED**",
          ]
          if actual != expected:
              lines += [
                  "",
                  "The OCR extraction was intentionally skipped because the source PDF bytes do not match the pinned Jan 22 bundle. Do not change the expected hash to force a pass."
              ]
          batches = sorted(
              Path("pipeline-output").glob("jan22-run-*/*/batch-manifest.json")
          )
          if batches:
              manifest_path = batches[-1]
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              batch = manifest_path.parent
              lines += ["", f"- Batch directory: `{batch}`", f"- Pipeline status: **{manifest.get('status', 'UNKNOWN')}**"]
              for name in ("validated", "review_required", "quarantined", "rejected", "dropped"):
                  data_path = batch / f"{name}.json"
                  count = len(json.loads(data_path.read_text(encoding="utf-8"))) if data_path.is_file() else 0
                  lines.append(f"- {name}: {count}")
          else:
              lines += ["", "- Extraction output: **not created**"]
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Fail closed if the intended source PDF did not match
        if: steps.source.outputs.verified != 'true'
        run: |
          echo "Source identity mismatch: no OCR extraction was performed. Check the verifier log and use the exact PDF whose SHA-256 is pinned in the Jan 22 source bundle." >&2
          exit 1
