name: Image-first PDF v2

on:
  push:
    branches:
      - image-first-pdf-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-image-first:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF==1.26.7"

      - name: Pin the exact requested PDF
        run: |
          test -f cEDaK5Wn5ILe4nOdotd6.pdf
          actual="$(git rev-parse HEAD:cEDaK5Wn5ILe4nOdotd6.pdf)"
          expected="bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          test "$actual" = "$expected"
          echo "Exact source PDF blob verified: $actual"

      - name: Probe source PDF structure
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          pdf=Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          doc=fitz.open(pdf)
          print("PAGE_COUNT", len(doc))
          print("TOC", doc.get_toc())
          for i,p in enumerate(doc,1):
              txt=(p.get_text("text") or "").replace("\n"," ")[:180]
              print(f"PAGE {i:03d}: text_chars={len(p.get_text('text') or '')} images={len(p.get_images(full=True))} rect={round(p.rect.width,1)}x{round(p.rect.height,1)} text={txt!r}")
          doc.close()
          PY

      - name: Render source-page probe images
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          pdf=Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          out=Path("source-page-probe")
          out.mkdir(exist_ok=True)
          doc=fitz.open(pdf)
          selected=[1,2,3,10,11,12,13,14,15,22,23,24]
          matrix=fitz.Matrix(0.35,0.35)
          for n in selected:
              if n <= len(doc):
                  pix=doc[n-1].get_pixmap(matrix=matrix,alpha=False)
                  pix.save(str(out/f"page-{n:02d}.jpg"),output="jpeg",jpg_quality=86)
          doc.close()
          print("Rendered probe pages:", sorted(p.name for p in out.iterdir()))
          PY

      - name: Run isolated pipeline self-test
        run: |
          python pipeline/image_first_pdf_v2/pipeline.py --self-test

      - name: Run real 75-question source-PDF extraction
        run: |
          python pipeline/image_first_pdf_v2/pipeline.py             --pdf cEDaK5Wn5ILe4nOdotd6.pdf             --output image-first-output             --expected-count 75             --max-pages 150

      - name: Enforce image-first contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("image-first-output")
          report = json.loads((out / "validation-report.json").read_text(encoding="utf-8"))
          if report.get("status") != "VALIDATED":
              raise SystemExit(f"Pipeline did not validate: {report}")

          rows = json.loads((out / "validated.json").read_text(encoding="utf-8"))
          if len(rows) != 75:
              raise SystemExit(f"Expected 75 records, got {len(rows)}")

          expected_opts = [{"key": c, "label": c} for c in "ABCD"]
          for i, row in enumerate(rows, 1):
              if row.get("question_text") is not None:
                  raise SystemExit(f"Question text present in record {i}")
              if row.get("solution_text") is not None:
                  raise SystemExit(f"Solution text present in record {i}")
              if row.get("options") != expected_opts:
                  raise SystemExit(f"Options are not exactly A/B/C/D in record {i}")
              for section in ("question", "solution"):
                  if section["type"] if False else False:
                      pass
                  block = row[section]
                  if block.get("type") != "SOURCE_PDF_PAGE_IMAGE":
                      raise SystemExit(f"{section} is not source-PDF image mode in record {i}")
                  refs = block.get("image_refs") or []
                  if not refs:
                      raise SystemExit(f"No {section} image refs in record {i}")
                  for ref in refs:
                      if not (out / ref).is_file():
                          raise SystemExit(f"Missing referenced asset: {ref}")

          marker = json.loads((out / "IMPORT_READY.json").read_text(encoding="utf-8"))
          if marker.get("status") != "VALIDATED":
              raise SystemExit("IMPORT_READY.json is not VALIDATED")
          if marker.get("database_write") or marker.get("cloudflare_write"):
              raise SystemExit("Live write flag unexpectedly enabled")

          print("IMAGE-FIRST CONTRACT PASSED")
          print("records:", len(rows))
          print("first:", rows[0]["question"]["image_refs"], "=>", rows[0]["solution"]["image_refs"])
          print("last:", rows[-1]["question"]["image_refs"], "=>", rows[-1]["solution"]["image_refs"])
          PY

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Image-first PDF v2"
            echo ""
            echo "- Existing pipeline files/workflows were not modified by this workflow."
            echo "- Source content mode: rendered PDF page images only."
            echo "- Question text stored: no."
            echo "- Solution text stored: no."
            echo "- Options: A, B, C, D."
            if test -f image-first-output/validation-report.json; then
              cat image-first-output/validation-report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-page probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-first-pdf-v2-source-page-probe
          path: source-page-probe/
          if-no-files-found: warn

      - name: Upload image-first review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-first-pdf-v2-review
          path: image-first-output/
          if-no-files-found: error
