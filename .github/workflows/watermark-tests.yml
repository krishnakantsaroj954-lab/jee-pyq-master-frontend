name: Watermark utility tests

on:
  push:
    branches: [main]
    paths:
      - "pipeline/watermark_images.py"
      - "tests/test_watermark_images.py"
      - ".github/workflows/watermark-tests.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-watermark-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "Pillow>=10,<13"
      - name: Run isolated watermark tests
        run: python -m pytest -q tests/test_watermark_images.py
