name: Read-only D1 Schema Audit

on:
  push:
    branches:
      - main
    paths:
      - "d1_schema_audit.sql"
      - ".github/workflows/d1-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Read database schema (read-only SQL)
        run: npx wrangler d1 execute jee-pyq-master --remote --file=d1_schema_audit.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
