name: Restore Jan 22 Shift 1 image bundle

on:
  push:
    branches: [main]
    paths:
      - "data/quarantine/2026-01-22-shift1/jee_main_2026_01_22_shift1_FINAL_75Q_BUNDLE.zip"
      - ".github/workflows/unpack-jan22-image-bundle.yml"

permissions:
  contents: write

concurrency:
  group: unpack-jan22-image-bundle
  cancel-in-progress: false

jobs:
  validate-extract-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract the exact source bundle
        env:
          BUNDLE_PATH: data/quarantine/2026-01-22-shift1/jee_main_2026_01_22_shift1_FINAL_75Q_BUNDLE.zip
          TARGET_DIR: data/quarantine/2026-01-22-shift1
          EXPECTED_BUNDLE_SHA256: b1c2358ef30469ed3ab16995f303e2d72cdfb78c26af58500b7229f805f40783
          EXPECTED_PDF_SHA256: 7d633fea3bf16857bc4c477d80b2a3eb2535603b54f665c3d683b777f02f52f3
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          bundle = Path(os.environ["BUNDLE_PATH"])
          target = Path(os.environ["TARGET_DIR"])
          expected_bundle_sha = os.environ["EXPECTED_BUNDLE_SHA256"]
          expected_pdf_sha = os.environ["EXPECTED_PDF_SHA256"]
          expected_json_name = "jee_main_2026_01_22_shift1_FINAL_75Q.json"
          actual_bundle_sha = hashlib.sha256(bundle.read_bytes()).hexdigest()
          if actual_bundle_sha != expected_bundle_sha:
              raise SystemExit(f"Bundle SHA-256 mismatch: {actual_bundle_sha}")
          with zipfile.ZipFile(bundle) as z:
              if z.testzip() is not None:
                  raise SystemExit("ZIP CRC/integrity check failed")
              names = z.namelist()
              if len(names) != 27 or len(names) != len(set(names)):
                  raise SystemExit(f"Unexpected bundle member count/duplicates: {len(names)}")
              for name in names:
                  p = Path(name)
                  if p.is_absolute() or ".." in p.parts or name.startswith("/"):
                      raise SystemExit(f"Unsafe ZIP path: {name}")
              json_bytes = z.read(expected_json_name)
              data = json.loads(json_bytes)
              paper = data.get("paper", {})
              if paper.get("paper_id") != "jee-main-2026-01-22-s1":
                  raise SystemExit("Paper identity mismatch")
              if paper.get("source_sha256") != expected_pdf_sha:
                  raise SystemExit("Source PDF SHA-256 mismatch")
              if paper.get("exam_date") != "2026-01-22" or paper.get("shift") != 1:
                  raise SystemExit("Paper date/shift mismatch")
              qs = data.get("questions", [])
              if len(qs) != 75 or {q.get("question_number") for q in qs} != set(range(1, 76)):
                  raise SystemExit("Question records are not exactly 1..75")
              q39 = next((q for q in qs if q.get("question_number") == 39), None)
              if not q39 or q39.get("question_status") != "Dropped" or q39.get("correct_answer") is not None or q39.get("answer_text") != "Dropped":
                  raise SystemExit("Q39 dropped-question preservation check failed")
              images = [n for n in names if n.lower().endswith((".jpg", ".jpeg", ".png", ".webp"))]
              expected_images = {f"images/pages/page_{i:02d}.jpg" for i in range(1, 25)}
              expected_images.add("images/questions/q039_question.jpg")
              if set(images) != expected_images:
                  raise SystemExit("Expected page images or Q39 crop are missing/extra")
              available = set(names)
              required_paths = set()
              for page in data.get("pages", []):
                  if page.get("image_path"): required_paths.add(page["image_path"])
                  if page.get("source_page_image_path"): required_paths.add(page["source_page_image_path"])
              for q in qs:
                  for key in ("question_image_path", "solution_image_path", "source_page_image_path"):
                      if q.get(key): required_paths.add(q[key])
              missing = sorted(p for p in required_paths if p not in available)
              if missing:
                  raise SystemExit("Referenced images missing from ZIP: " + ", ".join(missing))
              target.mkdir(parents=True, exist_ok=True)
              # Only extract the exact allow-listed image assets, dataset JSON, and bundle README.
              allowed = expected_images | {expected_json_name, "README.txt"}
              if set(names) != allowed:
                  raise SystemExit("Unexpected files found in bundle")
              z.extractall(target)
          # Verify extracted assets and create a machine-readable, hash-backed manifest.
          assets = []
          for rel in sorted(expected_images):
              p = target / rel
              raw = p.read_bytes()
              assets.append({"path": rel, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(), "mime_type": "image/jpeg"})
          manifest = {
              "manifest_version": "1.0.0",
              "paper_id": "jee-main-2026-01-22-s1",
              "dataset_json": expected_json_name,
              "dataset_sha256": hashlib.sha256((target / expected_json_name).read_bytes()).hexdigest(),
              "source_pdf_sha256": expected_pdf_sha,
              "bundle_sha256": actual_bundle_sha,
              "asset_count": len(assets),
              "assets_total_bytes": sum(a["bytes"] for a in assets),
              "assets": assets,
              "status": "ASSETS_EXTRACTED_AND_HASH_VERIFIED",
              "production_import": "NOT_PERFORMED"
          }
          (target / "asset-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "status": manifest["status"],
              "question_records": len(qs),
              "q39_status": q39["question_status"],
              "image_assets": len(assets),
              "referenced_paths_checked": len(required_paths),
              "bundle_sha256": actual_bundle_sha,
              "production_import": "NOT_PERFORMED"
          }, indent=2))

      - name: Generate question-specific crops and repair JSON image paths
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python pipeline/build_jan22_question_image_crops.py --data-dir data/quarantine/2026-01-22-shift1

      - name: Commit extracted images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quarantine/2026-01-22-shift1/images \
                  data/quarantine/2026-01-22-shift1/jee_main_2026_01_22_shift1_FINAL_75Q.json \
                  data/quarantine/2026-01-22-shift1/README.txt \
                  data/quarantine/2026-01-22-shift1/README.md \
                  data/quarantine/2026-01-22-shift1/image-crop-manifest.json \
                  data/quarantine/2026-01-22-shift1/asset-manifest.json
          if git diff --cached --quiet; then
            echo "No extracted asset changes to commit."
          else
            git commit -m "Add verified Jan 22 Shift 1 image assets"
            git push origin HEAD:main
          fi
