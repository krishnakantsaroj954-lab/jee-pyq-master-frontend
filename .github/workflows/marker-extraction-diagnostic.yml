name: Marker OCR Extraction Diagnostic

on:
  push:
    branches:
      - pipeline/marker-extraction-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marker-smoke:
    name: Marker three-page smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF metadata reader
        run: python -m pip install "pymupdf>=1.24,<2"

      - name: Verify the exact source PDF and page count
        shell: bash
        run: |
          set -euo pipefail
          test -f cEDaK5Wn5ILe4nOdotd6.pdf
          actual_blob="$(git rev-parse "HEAD:cEDaK5Wn5ILe4nOdotd6.pdf")"
          expected_blob="bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          test "$actual_blob" = "$expected_blob"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import fitz

          p = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          with fitz.open(p) as doc:
              pages = len(doc)
          info = {
              "source_pdf": p.name,
              "git_blob_sha": "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab",
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "size_bytes": p.stat().st_size,
              "page_count": pages,
              "declared_paper_identity": "JEE Main 2026 • 28 January • Shift 1 (still subject to source review)",
              "mode": "isolated Marker CPU diagnostic; no D1/API import",
          }
          if pages != 24:
              raise SystemExit(f"Expected the pinned 24-page source PDF; found {pages} pages")
          Path("marker-smoke-output").mkdir(exist_ok=True)
          Path("marker-smoke-output/source-info.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(info, ensure_ascii=False, indent=2))
          PY

      - name: Cache Marker model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab/models
            ~/.cache/huggingface
          key: marker-pdf-1.10.2-cpu-models-v1

      - name: Install pinned Marker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "marker-pdf==1.10.2"

      - name: Run Marker on first three pages
        id: marker_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export TORCH_DEVICE=cpu
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export TOKENIZERS_PARALLELISM=false
          mkdir -p marker-smoke-output
          set +e
          timeout 25m marker_single cEDaK5Wn5ILe4nOdotd6.pdf \
            --page_range "0-2" \
            --output_format json \
            --output_dir marker-smoke-output \
            --disable_multiprocessing \
            --debug 2>&1 | tee marker-smoke-output/marker-run.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > marker-smoke-output/marker-exit-code.txt
          echo "Marker smoke-test exit code: $result"
          exit "$result"

      - name: Summarize smoke output for diagnosis
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path("marker-smoke-output")
          files = []
          strings = []
          json_files = []

          def collect(value):
              if isinstance(value, str):
                  strings.append(value)
              elif isinstance(value, dict):
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              try:
                  size = p.stat().st_size
              except OSError:
                  size = 0
              files.append({"path": str(p), "size_bytes": size})
              if p.suffix.lower() == ".json" and p.name != "marker-summary.json":
                  json_files.append(str(p))
                  try:
                      collect(json.loads(p.read_text(encoding="utf-8")))
                  except Exception:
                      pass
              elif p.suffix.lower() in {".md", ".txt", ".html", ".csv"} and p.name != "marker-run.log":
                  try:
                      strings.append(p.read_text(encoding="utf-8", errors="replace"))
                  except Exception:
                      pass

          combined = "\n".join(strings)
          headers = re.findall(
              r"(?im)^\s*(?:(?:question|q)\s*)?(\d{1,3})\s*[.):]\s+\S",
              combined,
          )
          exit_path = root / "marker-exit-code.txt"
          summary = {
              "status": "MARKER_OUTPUT_PRESENT" if json_files or combined.strip() else "NO_MARKER_TEXT_OUTPUT",
              "exit_code": exit_path.read_text().strip() if exit_path.exists() else "runner_interrupted_before_exit_code",
              "json_outputs": json_files,
              "file_count": len(files),
              "files": files,
              "extracted_text_character_count": len(combined),
              "question_header_candidate_count": len(headers),
              "question_header_candidate_examples": headers[:40],
              "note": "Heuristic diagnostics only, not a correctness validation.",
          }
          (root / "marker-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload smoke-test output even after a Marker error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-smoke-output
          path: marker-smoke-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Require a completed smoke extraction before full run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marker-smoke-output/marker-exit-code.txt
          test "$(cat marker-smoke-output/marker-exit-code.txt)" = "0"
          find marker-smoke-output -type f -name '*.json' ! -name 'source-info.json' ! -name 'marker-summary.json' | grep -q .
          echo "Marker smoke extraction completed; full-paper run may proceed."

  marker-full:
    name: Marker full 24-page extraction
    needs: marker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF metadata reader and verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pymupdf>=1.24,<2"
          test "$(git rev-parse "HEAD:cEDaK5Wn5ILe4nOdotd6.pdf")" = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          python - <<'PY'
          import fitz
          from pathlib import Path
          with fitz.open("cEDaK5Wn5ILe4nOdotd6.pdf") as doc:
              print(f"Pinned source verified: {len(doc)} pages")
              if len(doc) != 24:
                  raise SystemExit("Pinned source page-count mismatch")
          Path("marker-full-output").mkdir(exist_ok=True)
          PY

      - name: Restore Marker model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab/models
            ~/.cache/huggingface
          key: marker-pdf-1.10.2-cpu-models-v1

      - name: Install pinned Marker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "marker-pdf==1.10.2"

      - name: Run Marker on all 24 source pages
        id: marker_full
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export TORCH_DEVICE=cpu
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export TOKENIZERS_PARALLELISM=false
          set +e
          timeout 75m marker_single cEDaK5Wn5ILe4nOdotd6.pdf \
            --page_range "0-23" \
            --output_format json \
            --output_dir marker-full-output \
            --disable_multiprocessing \
            --debug 2>&1 | tee marker-full-output/marker-run.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > marker-full-output/marker-exit-code.txt
          echo "Marker full-paper exit code: $result"
          exit "$result"

      - name: Summarize full-paper extraction
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path("marker-full-output")
          files, strings, json_files = [], [], []

          def collect(value):
              if isinstance(value, str):
                  strings.append(value)
              elif isinstance(value, dict):
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              try:
                  size = p.stat().st_size
              except OSError:
                  size = 0
              files.append({"path": str(p), "size_bytes": size})
              if p.suffix.lower() == ".json" and p.name != "marker-summary.json":
                  json_files.append(str(p))
                  try:
                      collect(json.loads(p.read_text(encoding="utf-8")))
                  except Exception:
                      pass
              elif p.suffix.lower() in {".md", ".txt", ".html", ".csv"} and p.name != "marker-run.log":
                  try:
                      strings.append(p.read_text(encoding="utf-8", errors="replace"))
                  except Exception:
                      pass

          combined = "\n".join(strings)
          headers = re.findall(
              r"(?im)^\s*(?:(?:question|q)\s*)?(\d{1,3})\s*[.):]\s+\S",
              combined,
          )
          exit_path = root / "marker-exit-code.txt"
          summary = {
              "status": "MARKER_OUTPUT_PRESENT" if json_files or combined.strip() else "NO_MARKER_TEXT_OUTPUT",
              "exit_code": exit_path.read_text().strip() if exit_path.exists() else "runner_interrupted_before_exit_code",
              "json_outputs": json_files,
              "file_count": len(files),
              "files": files,
              "extracted_text_character_count": len(combined),
              "question_header_candidate_count": len(headers),
              "question_header_candidate_examples": headers[:100],
              "note": "Heuristic diagnostics only. Do not import without verifying questions, options, answers, solutions and image crops against the source PDF.",
          }
          (root / "marker-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload full-paper extraction and debug assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-full-extraction
          path: marker-full-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Require completed extraction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marker-full-output/marker-exit-code.txt
          test "$(cat marker-full-output/marker-exit-code.txt)" = "0"
          find marker-full-output -type f -name '*.json' ! -name 'marker-summary.json' | grep -q .
          echo "Full-paper Marker run completed. Source correctness review remains required."
