name: Marker OCR Extraction Diagnostic

on:
  push:
    branches:
      - pipeline/marker-extraction-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marker-smoke:
    name: Marker one-page low-memory smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF metadata reader
        run: python -m pip install "pymupdf>=1.24,<2"

      - name: Verify exact source PDF and page count
        shell: bash
        run: |
          set -euo pipefail
          test -f cEDaK5Wn5ILe4nOdotd6.pdf
          test "$(git rev-parse "HEAD:cEDaK5Wn5ILe4nOdotd6.pdf")" = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import fitz
          p = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          with fitz.open(p) as doc:
              pages = len(doc)
          if pages != 24:
              raise SystemExit(f"Expected pinned 24-page PDF, found {pages}")
          info = {
              "source_pdf": p.name,
              "git_blob_sha": "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab",
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "size_bytes": p.stat().st_size,
              "page_count": pages,
              "mode": "Marker diagnostic only; no D1/API/live import",
          }
          Path("marker-smoke-output").mkdir(exist_ok=True)
          Path("marker-smoke-output/source-info.json").write_text(json.dumps(info, indent=2), encoding="utf-8")
          print(json.dumps(info, indent=2))
          PY

      - name: Cache Marker model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab/models
            ~/.cache/huggingface
          key: marker-pdf-1.10.2-cpu-models-v2

      - name: Install CPU-only PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__, "CUDA:", torch.cuda.is_available())
          if not torch.__version__.startswith("2.7.1") or torch.cuda.is_available():
              raise SystemExit("CPU-only PyTorch not confirmed")
          PY

      - name: Install pinned Marker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "marker-pdf==1.10.2"
          python - <<'PY'
          import torch
          import marker
          print("Marker import OK; PyTorch:", torch.__version__, "CUDA:", torch.cuda.is_available())
          if not torch.__version__.startswith("2.7.1") or torch.cuda.is_available():
              raise SystemExit("Marker replaced CPU-only PyTorch")
          PY

      - name: Write low-memory extraction configuration
        shell: bash
        run: |
          cat > marker-low-memory.json <<'JSON'
          {
            "layout_batch_size": 1,
            "detection_batch_size": 1,
            "ocr_error_batch_size": 1,
            "recognition_batch_size": 1,
            "pdftext_workers": 1,
            "lowres_image_dpi": 72,
            "highres_image_dpi": 160,
            "disable_tqdm": true
          }
          JSON
          cp marker-low-memory.json marker-smoke-output/marker-config.json

      - name: Run Marker on one representative source page
        id: marker_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export TORCH_DEVICE=cpu
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export TOKENIZERS_PARALLELISM=false
          set +e
          timeout 30m marker_single cEDaK5Wn5ILe4nOdotd6.pdf \
            --page_range "0" \
            --output_format json \
            --output_dir marker-smoke-output \
            --config_json marker-low-memory.json \
            --disable_multiprocessing 2>&1 | tee marker-smoke-output/marker-run.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > marker-smoke-output/marker-exit-code.txt
          echo "Marker one-page smoke exit code: $result"
          exit "$result"

      - name: Summarize smoke outputs
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path("marker-smoke-output")
          files, strings, json_files = [], [], []
          def walk(v):
              if isinstance(v, str): strings.append(v)
              elif isinstance(v, dict):
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
          for p in sorted(root.rglob("*")):
              if not p.is_file(): continue
              files.append({"path": str(p), "size_bytes": p.stat().st_size})
              if p.suffix.lower()==".json" and p.name!="marker-summary.json":
                  json_files.append(str(p))
                  try: walk(json.loads(p.read_text(encoding="utf-8")))
                  except Exception: pass
              elif p.suffix.lower() in {".md",".txt",".html"} and p.name not in {"marker-run.log"}:
                  try: strings.append(p.read_text(encoding="utf-8",errors="replace"))
                  except Exception: pass
          combined="\n".join(strings)
          exitfile=root/"marker-exit-code.txt"
          summary={
            "status":"MARKER_OUTPUT_PRESENT" if json_files or combined.strip() else "NO_MARKER_TEXT_OUTPUT",
            "exit_code":exitfile.read_text().strip() if exitfile.exists() else "runner_interrupted_before_exit_code",
            "json_outputs":json_files,
            "file_count":len(files),
            "files":files,
            "extracted_text_character_count":len(combined),
            "question_header_candidate_count":len(re.findall(r"(?im)^\s*(?:(?:question|q)\s*)?\d{1,3}\s*[.):]\s+\S",combined)),
            "note":"One-page smoke diagnostics only; source correctness review is still required."
          }
          (root/"marker-summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload smoke logs and partial outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-one-page-smoke
          path: marker-smoke-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Require successful one-page extraction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marker-smoke-output/marker-exit-code.txt
          test "$(cat marker-smoke-output/marker-exit-code.txt)" = "0"
          find marker-smoke-output -type f -name '*.json' ! -name 'source-info.json' ! -name 'marker-config.json' ! -name 'marker-summary.json' | grep -q .
          echo "One-page Marker smoke test passed."

  marker-full:
    name: Marker full-paper low-memory extraction
    needs: marker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF metadata reader and verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pymupdf>=1.24,<2"
          test "$(git rev-parse "HEAD:cEDaK5Wn5ILe4nOdotd6.pdf")" = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          python - <<'PY'
          import fitz
          with fitz.open("cEDaK5Wn5ILe4nOdotd6.pdf") as doc:
              print("Verified source pages:",len(doc))
              if len(doc)!=24: raise SystemExit("Pinned source page-count mismatch")
          PY

      - name: Cache Marker model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab/models
            ~/.cache/huggingface
          key: marker-pdf-1.10.2-cpu-models-v2

      - name: Install CPU-only PyTorch and pinned Marker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python -m pip install "marker-pdf==1.10.2"
          python - <<'PY'
          import torch, marker
          print("Marker and CPU PyTorch imports OK:",torch.__version__)
          if not torch.__version__.startswith("2.7.1") or torch.cuda.is_available():
              raise SystemExit("CPU-only PyTorch not confirmed")
          PY

      - name: Write low-memory extraction configuration
        shell: bash
        run: |
          cat > marker-low-memory.json <<'JSON'
          {
            "layout_batch_size": 1,
            "recognition_batch_size": 1,
            "pdftext_workers": 1,
            "lowres_image_dpi": 72,
            "highres_image_dpi": 160,
            "disable_tqdm": true
          }
          JSON
          mkdir -p marker-full-output
          cp marker-low-memory.json marker-full-output/marker-config.json

      - name: Run Marker on all 24 source pages
        id: marker_full
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export TORCH_DEVICE=cpu
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export TOKENIZERS_PARALLELISM=false
          set +e
          timeout 75m marker_single cEDaK5Wn5ILe4nOdotd6.pdf \
            --page_range "0-23" \
            --output_format json \
            --output_dir marker-full-output \
            --config_json marker-low-memory.json \
            --disable_multiprocessing 2>&1 | tee marker-full-output/marker-run.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > marker-full-output/marker-exit-code.txt
          echo "Marker full-paper exit code: $result"
          exit "$result"

      - name: Summarize full-paper output
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("marker-full-output")
          files,strings,json_files=[],[],[]
          def walk(v):
              if isinstance(v,str): strings.append(v)
              elif isinstance(v,dict):
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          for p in sorted(root.rglob("*")):
              if not p.is_file(): continue
              files.append({"path":str(p),"size_bytes":p.stat().st_size})
              if p.suffix.lower()==".json" and p.name!="marker-summary.json":
                  json_files.append(str(p))
                  try: walk(json.loads(p.read_text(encoding="utf-8")))
                  except Exception: pass
              elif p.suffix.lower() in {".md",".txt",".html"} and p.name!="marker-run.log":
                  try: strings.append(p.read_text(encoding="utf-8",errors="replace"))
                  except Exception: pass
          combined="\n".join(strings)
          exitfile=root/"marker-exit-code.txt"
          summary={
            "status":"MARKER_OUTPUT_PRESENT" if json_files or combined.strip() else "NO_MARKER_TEXT_OUTPUT",
            "exit_code":exitfile.read_text().strip() if exitfile.exists() else "runner_interrupted_before_exit_code",
            "json_outputs":json_files,
            "file_count":len(files),
            "files":files,
            "extracted_text_character_count":len(combined),
            "question_header_candidate_count":len(re.findall(r"(?im)^\s*(?:(?:question|q)\s*)?\d{1,3}\s*[.):]\s+\S",combined)),
            "note":"Heuristic diagnostics only. Verify questions, options, answers, solutions and question-specific images against original source before any import."
          }
          (root/"marker-summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload full-paper output and partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-full-paper-output
          path: marker-full-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Require completed full-paper extraction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marker-full-output/marker-exit-code.txt
          test "$(cat marker-full-output/marker-exit-code.txt)" = "0"
          find marker-full-output -type f -name '*.json' ! -name 'marker-config.json' ! -name 'marker-summary.json' | grep -q .
          echo "Full-paper Marker run completed. Source correctness verification is still required."
