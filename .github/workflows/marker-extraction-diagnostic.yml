name: Marker OCR Extraction Diagnostic

concurrency:
  group: marker-extraction-diagnostic-${{ github.ref }}
  cancel-in-progress: false

# Smoke runs automatically only on this isolated QA branch. Full-paper work remains manual opt-in.
on:
  push:
    branches:
      - fix/marker-paper-smoke-qa-20261011
  workflow_dispatch:
    inputs:
      run_full_paper:
        description: "Run all 24 pages only after the question-page smoke test passes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  marker-smoke:
    name: Marker representative question-page low-memory smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF metadata reader
        run: python -m pip install "pymupdf>=1.24,<2"

      - name: Verify exact source PDF and page count
        shell: bash
        run: |
          set -euo pipefail
          test -f cEDaK5Wn5ILe4nOdotd6.pdf
          test "$(git rev-parse "HEAD:cEDaK5Wn5ILe4nOdotd6.pdf")" = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import fitz
          p = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          with fitz.open(p) as doc:
              pages = len(doc)
          if pages != 24:
              raise SystemExit(f"Expected pinned 24-page PDF, found {pages}")
          info = {
              "source_pdf": p.name,
              "git_blob_sha": "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab",
              "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "size_bytes": p.stat().st_size,
              "page_count": pages,
              "mode": "Marker diagnostic only; no D1/API/live import",
          }
          Path("marker-smoke-output").mkdir(exist_ok=True)
          Path("marker-smoke-output/source-info.json").write_text(json.dumps(info, indent=2), encoding="utf-8")
          print(json.dumps(info, indent=2))
          PY

      - name: Save source-page ground truth for manual review
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          pdf = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          out = Path("marker-smoke-output/source-pages")
          out.mkdir(parents=True, exist_ok=True)
          report = []
          with fitz.open(pdf) as doc:
              for index in (0, 1, 2):
                  if index >= len(doc):
                      continue
                  page = doc[index]
                  report.append({"page_index_zero_based": index, "page_number_one_based": index + 1, "text": page.get_text("text")})
                  if index in (0, 1):
                      page.get_pixmap(matrix=fitz.Matrix(1, 1), alpha=False).save(out / f"source-page-{index+1:02d}.png")
          (out / "source-pages-text.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps([{"page_index_zero_based":x["page_index_zero_based"],"page_number_one_based":x["page_number_one_based"],"text_preview":x["text"][:900]} for x in report], ensure_ascii=False, indent=2))
          PY

      - name: Cache Marker model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab/models
            ~/.cache/huggingface
          key: marker-pdf-1.10.2-cpu-models-v2

      - name: Install CPU-only PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__, "CUDA:", torch.cuda.is_available())
          if not torch.__version__.startswith("2.7.1") or torch.cuda.is_available():
              raise SystemExit("CPU-only PyTorch not confirmed")
          PY

      - name: Install pinned Marker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "marker-pdf==1.10.2"
          python - <<'PY'
          import torch
          import marker
          print("Marker import OK; PyTorch:", torch.__version__, "CUDA:", torch.cuda.is_available())
          if not torch.__version__.startswith("2.7.1") or torch.cuda.is_available():
              raise SystemExit("Marker replaced CPU-only PyTorch")
          PY

      - name: Write low-memory extraction configuration
        shell: bash
        run: |
          cat > marker-low-memory.json <<'JSON'
          {
            "layout_batch_size": 1,
            "detection_batch_size": 1,
            "ocr_error_batch_size": 1,
            "recognition_batch_size": 1,
            "pdftext_workers": 1,
            "lowres_image_dpi": 72,
            "highres_image_dpi": 160,
            "disable_tqdm": true
          }
          JSON
          cp marker-low-memory.json marker-smoke-output/marker-config.json

      - name: Run Marker on the first question page (source page 2)
        id: marker_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export TORCH_DEVICE=cpu
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export TOKENIZERS_PARALLELISM=false
          set +e
          timeout 30m marker_single cEDaK5Wn5ILe4nOdotd6.pdf \
            --page_range "1" \
            --output_format json \
            --output_dir marker-smoke-output \
            --config_json marker-low-memory.json \
            --disable_multiprocessing 2>&1 | tee marker-smoke-output/marker-run.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > marker-smoke-output/marker-exit-code.txt
          echo "Marker one-page smoke exit code: $result"
          exit "$result"

      - name: Summarize smoke outputs
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          root = Path("marker-smoke-output")
          files, strings, json_files = [], [], []
          def walk(v):
              if isinstance(v, str): strings.append(v)
              elif isinstance(v, dict):
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
          for p in sorted(root.rglob("*")):
              if not p.is_file(): continue
              files.append({"path": str(p), "size_bytes": p.stat().st_size})
              if (p.suffix.lower() == ".json"
                  and p.name not in {"marker-summary.json", "source-info.json", "marker-config.json"}
                  and not p.name.endswith("_meta.json")):
                  json_files.append(str(p))
                  try: walk(json.loads(p.read_text(encoding="utf-8")))
                  except Exception: pass
              elif p.suffix.lower() in {".md", ".txt", ".html"} and p.name != "marker-run.log":
                  try: strings.append(p.read_text(encoding="utf-8", errors="replace"))
                  except Exception: pass
          combined = "\n".join(strings)
          plain_text = html.unescape(re.sub(r"<[^>]+>", "\n", combined))
          plain_text = re.sub(r"[ \t]+", " ", plain_text)
          plain_text = re.sub(r"\n{2,}", "\n", plain_text)
          question_count = len(re.findall(r"(?im)^\s*(?:(?:question|q)\s*)?\d{1,3}\s*[.):]\s*\S", plain_text))
          exitfile = root / "marker-exit-code.txt"
          summary = {
            "status": "QUESTION_PAGE_CANDIDATE_FOUND" if json_files and question_count > 0 else "NO_QUESTION_PAGE_CANDIDATE",
            "exit_code": exitfile.read_text().strip() if exitfile.exists() else "runner_interrupted_before_exit_code",
            "json_outputs": json_files,
            "file_count": len(files),
            "files": files,
            "extracted_text_character_count": len(plain_text),
            "question_header_candidate_count": question_count,
            "text_preview": plain_text[:1200],
            "note": "Smoke uses source PDF page 2 (zero-based page index 1). Candidate detection is only a gate; it is not proof of answer/solution correctness."
          }
          (root / "marker-summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload smoke logs and partial outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-question-page-smoke
          path: marker-smoke-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Require a valid question-page smoke result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marker-smoke-output/marker-exit-code.txt
          test "$(cat marker-smoke-output/marker-exit-code.txt)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("marker-smoke-output/marker-summary.json").read_text(encoding="utf-8"))
          outputs = [p for p in summary["json_outputs"] if not p.endswith("_meta.json")]
          if not outputs:
              raise SystemExit("Marker returned no extraction JSON")
          if summary["extracted_text_character_count"] < 500:
              raise SystemExit("Question-page output is too short to validate")
          if summary["question_header_candidate_count"] < 1:
              raise SystemExit("No question-number candidate detected; refusing false-positive smoke pass")
          print("Question-page Marker smoke passed candidate checks; manual source review is still required.")
          PY

  marker-full:
    if: inputs.run_full_paper
    name: Marker full-paper low-memory extraction
    needs: marker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF metadata reader and verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pymupdf>=1.24,<2"
          test "$(git rev-parse "HEAD:cEDaK5Wn5ILe4nOdotd6.pdf")" = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          python - <<'PY'
          import fitz
          with fitz.open("cEDaK5Wn5ILe4nOdotd6.pdf") as doc:
              print("Verified source pages:",len(doc))
              if len(doc)!=24: raise SystemExit("Pinned source page-count mismatch")
          PY

      - name: Cache Marker model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab/models
            ~/.cache/huggingface
          key: marker-pdf-1.10.2-cpu-models-v2

      - name: Install CPU-only PyTorch and pinned Marker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python -m pip install "marker-pdf==1.10.2"
          python - <<'PY'
          import torch, marker
          print("Marker and CPU PyTorch imports OK:",torch.__version__)
          if not torch.__version__.startswith("2.7.1") or torch.cuda.is_available():
              raise SystemExit("CPU-only PyTorch not confirmed")
          PY

      - name: Write low-memory extraction configuration
        shell: bash
        run: |
          cat > marker-low-memory.json <<'JSON'
          {
            "layout_batch_size": 1,
            "detection_batch_size": 1,
            "ocr_error_batch_size": 1,
            "recognition_batch_size": 1,
            "pdftext_workers": 1,
            "lowres_image_dpi": 72,
            "highres_image_dpi": 160,
            "disable_tqdm": true
          }
          JSON
          mkdir -p marker-full-output
          cp marker-low-memory.json marker-full-output/marker-config.json

      - name: Run Marker on all 24 source pages
        id: marker_full
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export TORCH_DEVICE=cpu
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export TOKENIZERS_PARALLELISM=false
          set +e
          timeout 75m marker_single cEDaK5Wn5ILe4nOdotd6.pdf \
            --page_range "0-23" \
            --output_format json \
            --output_dir marker-full-output \
            --config_json marker-low-memory.json \
            --disable_multiprocessing 2>&1 | tee marker-full-output/marker-run.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > marker-full-output/marker-exit-code.txt
          echo "Marker full-paper exit code: $result"
          exit "$result"

      - name: Summarize full-paper output
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("marker-full-output")
          files,strings,json_files=[],[],[]
          def walk(v):
              if isinstance(v,str): strings.append(v)
              elif isinstance(v,dict):
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          for p in sorted(root.rglob("*")):
              if not p.is_file(): continue
              files.append({"path":str(p),"size_bytes":p.stat().st_size})
              if p.suffix.lower()==".json" and p.name!="marker-summary.json":
                  json_files.append(str(p))
                  try: walk(json.loads(p.read_text(encoding="utf-8")))
                  except Exception: pass
              elif p.suffix.lower() in {".md",".txt",".html"} and p.name!="marker-run.log":
                  try: strings.append(p.read_text(encoding="utf-8",errors="replace"))
                  except Exception: pass
          combined="\n".join(strings)
          exitfile=root/"marker-exit-code.txt"
          summary={
            "status":"MARKER_OUTPUT_PRESENT" if json_files or combined.strip() else "NO_MARKER_TEXT_OUTPUT",
            "exit_code":exitfile.read_text().strip() if exitfile.exists() else "runner_interrupted_before_exit_code",
            "json_outputs":json_files,
            "file_count":len(files),
            "files":files,
            "extracted_text_character_count":len(combined),
            "question_header_candidate_count":len(re.findall(r"(?im)^\s*(?:(?:question|q)\s*)?\d{1,3}\s*[.):]\s+\S",combined)),
            "note":"Heuristic diagnostics only. Verify questions, options, answers, solutions and question-specific images against original source before any import."
          }
          (root/"marker-summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload full-paper output and partial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-full-paper-output
          path: marker-full-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Require completed full-paper extraction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marker-full-output/marker-exit-code.txt
          test "$(cat marker-full-output/marker-exit-code.txt)" = "0"
          find marker-full-output -type f -name '*.json' ! -name 'marker-config.json' ! -name 'marker-summary.json' | grep -q .
          echo "Full-paper Marker run completed. Source correctness verification is still required."
