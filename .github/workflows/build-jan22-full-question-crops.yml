name: Build and QA Jan 22 Shift 1 full-question crops

on:
  workflow_dispatch:
  push:
    branches: ["pipeline/source-grounded-parser-review"]
    paths:
      - ".github/workflows/build-jan22-full-question-crops.yml"
      - "pipeline/build_jan22_question_image_crops.py"
      - "pipeline/build_jan22_full_question_crops.py"
      - "tests/test_jan22_full_question_crops.py"

permissions:
  contents: write

concurrency:
  group: jan22-full-question-crops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-review-crops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: data/quarantine/2026-01-22-shift1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR, image and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          python -m pip install --disable-pip-version-check Pillow pytesseract pytest
      - name: Test source-aware boundary rules
        run: python -m pytest -q tests/test_jan22_full_question_crops.py
      - name: Rebuild bounded figure and solution crops
        run: python pipeline/build_jan22_question_image_crops.py --data-dir "$DATA_DIR"
      - name: OCR verified source-page images and build all 75 full-question crops
        run: |
          python pipeline/build_jan22_full_question_crops.py --data-dir "$DATA_DIR"
          cat "$DATA_DIR/full-question-build-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed on structural or source-contract errors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/quarantine/2026-01-22-shift1")
          data = json.loads((root / "jee_main_2026_01_22_shift1_FINAL_75Q.json").read_text(encoding="utf-8"))
          report = json.loads((root / "full-question-build-report.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "full-question-crop-manifest.json").read_text(encoding="utf-8"))
          assert report["status"] == "REVIEW_REQUIRED"
          assert report["question_records"] == 75 and report["full_question_crops"] == 75
          assert report["question_numbers_exactly_1_to_75"] is True
          assert report["all_question_image_references_exist"] is True
          assert report["source_pdf_sha256"] == "7d633fea3bf16857bc4c477d80b2a3eb2535603b54f665c3d683b777f02f52f3"
          assert report["source_pdf_bytes_verified_in_this_run"] is False
          assert manifest["quality_status"] == "REVIEW_REQUIRED" and len(manifest["question_crops"]) == 75
          q39 = next(q for q in data["questions"] if q["question_number"] == 39)
          assert q39["question_status"] == "Dropped" and q39["correct_answer"] is None and q39["answer_text"] == "Dropped"
          assert report["q39_includes_dropped_source_label"] is True
          assert not (root / "IMPORT_READY.json").exists()
          print(json.dumps({"status":"STRUCTURAL_QA_PASSED_REVIEW_REQUIRED","questions":75,"full_question_crops":75,"assets":report["total_jpeg_assets"],"q39":"Dropped","direct_pdf_bytes_verified":False,"production_import":"NOT_PERFORMED"}, indent=2))
          PY
      - name: Commit generated review images and manifests to this branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_DIR/jee_main_2026_01_22_shift1_FINAL_75Q.json" \
                  "$DATA_DIR/images" \
                  "$DATA_DIR/asset-manifest.json" \
                  "$DATA_DIR/image-crop-manifest.json" \
                  "$DATA_DIR/full-question-crop-manifest.json" \
                  "$DATA_DIR/full-question-build-report.json" \
                  "$DATA_DIR/crop-build-report.json" \
                  "$DATA_DIR/README.md" "$DATA_DIR/README.txt" \
                  "$DATA_DIR/question-crops-contact-sheet.jpg" \
                  "$DATA_DIR/solution-crops-contact-sheet.jpg" \
                  "$DATA_DIR/full-question-crops-contact-sheet.jpg" \
                  "$DATA_DIR/full-question-crops-q01-q25.jpg" \
                  "$DATA_DIR/full-question-crops-q26-q50.jpg" \
                  "$DATA_DIR/full-question-crops-q51-q75.jpg"
          if git diff --cached --quiet; then
            echo "No generated crop or report changes to commit."
          else
            git commit -m "chore: add source-grounded full-question crops"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi