name: Pipeline CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run unit tests
        run: python -m pytest -q

      - name: Prepare representative dry-run config
        if: hashFiles('cEDaK5Wn5ILe4nOdotd6.pdf') != ''
        run: |
          python - <<'PY'
          import json
          import re
          import fitz
          from pathlib import Path

          pdf = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          doc = fitz.open(pdf)
          text = "\n".join((p.get_text("text") or "") for p in doc)
          markers = {
              "jee_main_2026": bool(re.search(r"JEE\s*Main\s*2026", text, re.I)),
              "jan_28": bool(re.search(r"28\s*(?:st|th)?\s*(?:January|Jan)", text, re.I)),
              "shift_1": bool(re.search(r"Shift\s*1|Morning", text, re.I)),
          }
          if not all(markers.values()):
              raise SystemExit(f"Representative PDF identity gate failed: {markers}")

          expected = (
              [f"Physics:{n}" for n in range(1, 26)] +
              [f"Chemistry:{n}" for n in range(1, 26)] +
              [f"Mathematics:{n}" for n in range(1, 26)]
          )

          cfg = {
              "source_pdf": str(pdf),
              "release": "2026-01",
              "exam": "JEE-MAIN",
              "year": 2026,
              "session": "Session 1 • Jan • 28 Jan • Shift 1",
              "paper": "Paper 1 • B.E./B.Tech",
              "subject": "PCM",
              "page_range": [1, len(doc)],
              "expected_question_count": 75,
              "expected_question_numbers": expected,
              "source_has_solutions": True
          }
          Path("representative-config.json").write_text(
              json.dumps(cfg, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "pdf": pdf.name,
              "size_bytes": pdf.stat().st_size,
              "page_count": len(doc),
              "identity_markers": markers,
              "expected_questions": len(expected),
          }, indent=2))
          doc.close()
          PY

      - name: Run strict representative dry-run
        if: hashFiles('cEDaK5Wn5ILe4nOdotd6.pdf') != ''
        run: |
          PYTHONPATH=pipeline python -m jee_pyq_pipeline.cli \
            --config representative-config.json \
            --output pipeline-output \
            --max-pages 150 \
            --timeout-seconds 1200

      - name: Upload representative dry-run artifacts
        if: always() && hashFiles('representative-config.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: representative-pdf-dry-run
          path: |
            representative-config.json
            pipeline-output/
          if-no-files-found: warn
