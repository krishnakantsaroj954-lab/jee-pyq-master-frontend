name: Pipeline CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pipeline-ci.yml"
      - "pipeline/jee_pyq_pipeline/**"
      - "pipeline/watermark_images.py"
      - "tests/**"
      - "pyproject.toml"
      - "docs/**"
      - "PIPELINE_STATUS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pipeline-ci.yml"
      - "pipeline/jee_pyq_pipeline/**"
      - "pipeline/watermark_images.py"
      - "tests/**"
      - "pyproject.toml"
      - "docs/**"
      - "PIPELINE_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run parser, source-validation, review-gate, and watermark tests
        run: python -m pytest -q

      # Deliberately no generated sample questions, production imports, deployment,
      # large artifact uploads, or assertion that an unreviewed real paper is green.
