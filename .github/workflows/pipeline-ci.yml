name: Pipeline CI # representative-pdf-probe
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q

      - name: Probe uploaded representative PDF
        if: hashFiles('cEDaK5Wn5ILe4nOdotd6.pdf') != ''
        run: |
          python - <<'PY'
          import json, re, fitz
          from pathlib import Path
          pdf=Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          doc=fitz.open(pdf)
          pages=[]
          qnums=[]
          for i,p in enumerate(doc,1):
              txt=p.get_text("text") or ""
              pages.append({
                  "page": i,
                  "chars": len(txt),
                  "head": txt[:1200],
                  "tail": txt[-800:],
                  "question_candidates": [int(x) for x in re.findall(r'(?m)^\\s*(\\d{1,3})[.)]\\s', txt)]
              })
              qnums.extend(pages[-1]["question_candidates"])
          probe={
              "filename": pdf.name,
              "size_bytes": pdf.stat().st_size,
              "page_count": len(doc),
              "question_candidate_unique": sorted(set(qnums)),
              "pages": pages,
          }
          Path("pdf-probe.json").write_text(json.dumps(probe, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"PDF={pdf.name} SIZE={pdf.stat().st_size} PAGES={len(doc)}")
          print("QUESTION_CANDIDATES=" + ",".join(map(str, sorted(set(qnums)))))
          for p in pages:
              print(f"PAGE {p['page']}: chars={p['chars']}")
              for line in (p["head"] + "\n" + p["tail"]).splitlines():
                  s=line.strip()
                  if s and ("answer" in s.lower() or "solution" in s.lower() or "question" in s.lower() or re.match(r'^\\d{1,3}[.)]', s)):
                      print("  " + s[:240])
          PY

      - name: Upload PDF probe
        if: always() && hashFiles('pdf-probe.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: representative-pdf-probe
          path: pdf-probe.json
