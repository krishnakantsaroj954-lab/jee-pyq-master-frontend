name: JEE PYQ Image-First Pipeline CI
# image-first validation trigger v8

on:
  workflow_dispatch:
  push:
    branches: [image-first-pipeline, fix/image-first-column-aware]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  image-first:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install OCR runtime for region detection
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -n 1

      - name: Unit tests
        run: python -m pytest -q

      - name: Require exact representative PDF
        run: |
          test -f cEDaK5Wn5ILe4nOdotd6.pdf
          test "$(git rev-parse HEAD:cEDaK5Wn5ILe4nOdotd6.pdf)" = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"

      - name: Prepare exact representative config
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          import fitz
          from pathlib import Path

          pdf = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          cfg_path = Path("representative-config.json")
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          doc = fitz.open(pdf)
          cfg["page_range"] = [1, len(doc)]
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "page_count": len(doc),
              "size_bytes": pdf.stat().st_size,
              "sha256": hashlib.sha256(pdf.read_bytes()).hexdigest(),
              "git_blob_sha": subprocess.check_output(["git","rev-parse",f"HEAD:{pdf.name}"],text=True).strip()
          }, indent=2))
          doc.close()
          PY

      - name: Capture source PDF layout diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          import fitz

          pdf = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          doc = fitz.open(pdf)
          out = {"page_count": len(doc), "pages": []}
          kw = re.compile(r"question|ques|solution|sol\\.?|answer|ans\\.?|physics|chemistry|mathematics|maths|options?|correct|subject", re.I)

          for pno, page in enumerate(doc, 1):
              native = page.get_text("dict")
              native_lines = []
              for block in native.get("blocks", []):
                  for line in block.get("lines", []):
                      spans = line.get("spans", [])
                      if not spans:
                          continue
                      text = "".join(sp.get("text", "") for sp in spans).strip()
                      if not text:
                          continue
                      bbox = line.get("bbox", [0,0,0,0])
                      sizes = [float(sp.get("size", 0)) for sp in spans]
                      flags = [int(sp.get("flags", 0)) for sp in spans]
                      native_lines.append({
                          "text": text[:500],
                          "x0": round(float(bbox[0]),2), "y0": round(float(bbox[1]),2),
                          "x1": round(float(bbox[2]),2), "y1": round(float(bbox[3]),2),
                          "max_font_size": round(max(sizes or [0]),2),
                          "flags": flags[:8],
                      })

              try:
                  tp = page.get_textpage_ocr(language="eng", dpi=250, full=True)
                  ocr_words = page.get_text("words", textpage=tp)
              except Exception:
                  ocr_words = []

              # Simple OCR line reconstruction for diagnostic purposes only.
              ocr = []
              for w in sorted(ocr_words, key=lambda z:(float(z[1]),float(z[0]))):
                  if ocr and abs(float(w[1]) - ocr[-1]["y"]) <= 3.5:
                      ocr[-1]["words"].append(w[4])
                      ocr[-1]["x1"] = max(ocr[-1]["x1"], float(w[2]))
                  else:
                      ocr.append({"y":float(w[1]),"x0":float(w[0]),"x1":float(w[2]),"words":[w[4]]})
              ocr_lines = []
              for ln in ocr:
                  txt = " ".join(ln["words"]).strip()
                  if txt:
                      ocr_lines.append({
                          "text": txt[:500],
                          "x0": round(ln["x0"],2), "y0": round(ln["y"],2), "x1": round(ln["x1"],2)
                      })

              out["pages"].append({
                  "page": pno,
                  "size": [round(float(page.rect.width),2), round(float(page.rect.height),2)],
                  "native_keyword_lines": [x for x in native_lines if kw.search(x["text"])],
                  "ocr_keyword_lines": [x for x in ocr_lines if kw.search(x["text"])],
                  "native_numberish_lines": [x for x in native_lines if re.match(r"^\\s*[0-9]{1,2}(?:\\s|[.):\\-])", x["text"])][:80],
                  "ocr_numberish_lines": [x for x in ocr_lines if re.match(r"^\\s*[0-9]{1,2}(?:\\s|[.):\\-])", x["text"])][:80],
                  "native_line_count": len(native_lines),
                  "ocr_line_count": len(ocr_lines),
              })

          Path("pdf-layout-diagnostic.json").write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"pages={len(doc)}")
          print(f"diagnostic_bytes={Path('pdf-layout-diagnostic.json').stat().st_size}")
          doc.close()
          PY

      - name: Run image-first extraction
        run: |
          PYTHONPATH=pipeline python -m jee_pyq_pipeline.cli \
            --config representative-config.json \
            --output pipeline-output \
            --max-pages 150

      - name: Enforce green image contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("pipeline-output").glob("*/validation-report.json"))
          if len(reports) != 1:
              raise SystemExit(f"Expected exactly one validation report, found {len(reports)}")
          report = json.loads(reports[0].read_text(encoding="utf-8"))

          if report["status"] != "VALIDATED":
              raise SystemExit(f"Pipeline is not VALIDATED: {report['status']}")
          if report["counts"]["validated"] != 75 or report["counts"]["quarantined"] != 0 or report["counts"]["rejected"] != 0:
              raise SystemExit(f"Bad batch counts: {report['counts']}")
          if report["blocking_issue_count"] != 0:
              raise SystemExit(f"Blocking issues remain: {report['blocking_issue_count']}")
          if report["subject_counts"] != {"Physics":25,"Chemistry":25,"Mathematics":25}:
              raise SystemExit(f"Bad subject distribution: {report['subject_counts']}")

          batch = reports[0].parent
          questions = json.loads((batch / "validated.json").read_text(encoding="utf-8"))
          if len(questions) != 75:
              raise SystemExit("validated.json does not contain 75 records")

          expected_options = {"A":"A","B":"B","C":"C","D":"D"}
          for q in questions:
              if q["text"] != "":
                  raise SystemExit(f"Non-empty synthesized question text: {q['id']}")
              if q["options"] != expected_options:
                  raise SystemExit(f"Options are not label-only for {q['id']}")
              if not q["assets"]:
                  raise SystemExit(f"Missing question image for {q['id']}")
              if not q.get("solution") or q["solution"]["mode"] != "source_pdf_image" or not q["solution"]["assets"]:
                  raise SystemExit(f"Missing solution image for {q['id']}")
              for asset in q["assets"] + q["solution"]["assets"]:
                  if not Path(asset["path"]).is_file():
                      raise SystemExit(f"Missing image file: {asset['path']}")
                  if asset["mime_type"] != "image/png":
                      raise SystemExit(f"Non-PNG source image: {asset['path']}")

          marker = json.loads((batch / "IMPORT_READY.json").read_text(encoding="utf-8"))
          if marker["status"] != "VALIDATED":
              raise SystemExit("IMPORT_READY does not confirm VALIDATED")
          if marker["image_contract"]["options"] != ["A","B","C","D"]:
              raise SystemExit("Wrong option contract")

          print("GREEN IMAGE CONTRACT PASSED")
          print(json.dumps({
              "status":report["status"],
              "counts":report["counts"],
              "subject_counts":report["subject_counts"],
              "question_type_counts":report["question_type_counts"],
              "answer_count":report["answer_count"],
              "asset_count":report["asset_count"]
          }, indent=2))
          PY

      - name: Upload review batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-first-review-batch
          path: |
            representative-config.json
            pipeline-output/*/validation-report.json
            pipeline-output/*/batch-manifest.json
            pipeline-output/*/source-intake.json
            pipeline-output/*/source-answers.json
            pipeline-output/*/source-solutions.json
            pipeline-output/*/validated.json
            pipeline-output/*/quarantined.json
            pipeline-output/*/rejected.json
            pipeline-output/*/IMPORT_READY.json
            pipeline-output/*/assets/**
pdf-layout-diagnostic.json
          if-no-files-found: error
