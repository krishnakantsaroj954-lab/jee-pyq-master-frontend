name: Pipeline CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -e ".[test]"
      - name: Run unit tests
        run: python -m pytest -q

      - name: Prepare representative dry-run config
        if: hashFiles('cEDaK5Wn5ILe4nOdotd6.pdf') != ''
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import fitz
          from pathlib import Path

          pdf = Path("cEDaK5Wn5ILe4nOdotd6.pdf")
          expected_git_blob_sha = "bc7570e370d5409b62dc3fe88d2d1dcc1378a0ab"
          actual_git_blob_sha = subprocess.check_output(
              ["git", "rev-parse", f"HEAD:{pdf.name}"], text=True
          ).strip()

          if actual_git_blob_sha != expected_git_blob_sha:
              raise SystemExit(
                  "Representative PDF identity gate failed: "
                  f"expected git blob {expected_git_blob_sha}, "
                  f"got {actual_git_blob_sha}"
              )

          source_sha256 = hashlib.sha256(pdf.read_bytes()).hexdigest()
          doc = fitz.open(pdf)
          page_count = len(doc)
          text_chars = sum(len(p.get_text("text") or "") for p in doc)
          if page_count < 1:
              raise SystemExit("Representative PDF identity gate failed: PDF has no pages")

          expected = (
              [f"Physics:{n}" for n in range(1, 26)] +
              [f"Chemistry:{n}" for n in range(1, 26)] +
              [f"Mathematics:{n}" for n in range(1, 26)]
          )

          cfg = {
              "source_pdf": str(pdf),
              "release": "2026-01",
              "exam": "JEE-MAIN",
              "year": 2026,
              "session": "Session 1 • Jan • 28 Jan • Shift 1",
              "paper": "Paper 1 • B.E./B.Tech",
              "subject": "PCM",
              "page_range": [1, page_count],
              "expected_question_count": 75,
              "expected_question_numbers": expected,
              "source_has_solutions": True
          }
          Path("representative-config.json").write_text(
              json.dumps(cfg, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          print(json.dumps({
              "pdf": pdf.name,
              "git_blob_sha": actual_git_blob_sha,
              "sha256": source_sha256,
              "size_bytes": pdf.stat().st_size,
              "page_count": page_count,
              "text_chars": text_chars,
              "expected_questions": len(expected),
              "identity_basis": "pinned repository blob; semantic metadata recorded in config"
          }, indent=2))
          doc.close()
          PY

      - name: Run strict representative dry-run
        if: hashFiles('cEDaK5Wn5ILe4nOdotd6.pdf') != ''
        continue-on-error: true
        run: |
          PYTHONPATH=pipeline python -m jee_pyq_pipeline.cli             --config representative-config.json             --output pipeline-output             --max-pages 150             --timeout-seconds 1200

      - name: Summarize strict dry-run result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("pipeline-output").glob("*/validation-report.json"))
          if not reports:
              raise SystemExit("No validation-report.json was produced")
          for path in reports:
              report = json.loads(path.read_text(encoding="utf-8"))
              summary = {
                  "report": str(path),
                  "status": report.get("status"),
                  "counts": report.get("counts"),
                  "question_type_counts": report.get("question_type_counts"),
                  "subject_counts": report.get("subject_counts"),
                  "blocking_issue_count": report.get("blocking_issue_count"),
                  "issue_codes": sorted({i.get("code") for i in report.get("issues", [])}),
              }
              print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload representative dry-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-pdf-dry-run-reports
          path: |
            representative-config.json
            pipeline-output/*/validation-report.json
            pipeline-output/*/batch-manifest.json
            pipeline-output/*/source-intake.json
            pipeline-output/*/source-answers.json
            pipeline-output/*/source-solutions.json
            pipeline-output/*/validated.json
            pipeline-output/*/quarantined.json
            pipeline-output/*/rejected.json
            pipeline-output/*/IMPORT_READY.json
          if-no-files-found: warn
